services:
  - type: web
    name: codelens-backend
    runtime: python
    buildCommand: apt-get update && apt-get install -y git && pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: CEREBRAS_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
